<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focused Tasks</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="app">

    <!-- Left: Project list -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="app-logo">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" fill="var(--accent)"/>
            <rect x="11" y="2" width="7" height="7" rx="1.5" fill="var(--accent)" opacity=".4"/>
            <rect x="2" y="11" width="7" height="7" rx="1.5" fill="var(--accent)" opacity=".4"/>
            <rect x="11" y="11" width="7" height="7" rx="1.5" fill="var(--accent)" opacity=".2"/>
          </svg>
        </span>
        <span class="app-name">Focused</span>
      </div>

      <nav class="project-list" id="projectList"></nav>

      <div class="sidebar-footer">
        <button class="btn-add-project" id="btnAddProject">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          New project
        </button>
        <div class="sync-row">
          <button class="btn-sync" id="btnExport" title="Export all data as JSON">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M6.5 1v7M4 6l2.5 2.5L9 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1.5 9.5v1A1.5 1.5 0 003 12h7a1.5 1.5 0 001.5-1.5v-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Export
          </button>
          <button class="btn-sync" id="btnImport" title="Import and merge from JSON">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M6.5 9V2M4 4.5L6.5 2 9 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1.5 9.5v1A1.5 1.5 0 003 12h7a1.5 1.5 0 001.5-1.5v-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Import
          </button>
          <input type="file" id="importFileInput" accept=".json" style="display:none" />
        </div>
      </div>
    </aside>

    <!-- Right: Task pane -->
    <main class="task-pane" id="taskPane">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="8" width="14" height="14" rx="3" fill="var(--accent)" opacity=".15"/>
            <rect x="26" y="8" width="14" height="14" rx="3" fill="var(--accent)" opacity=".08"/>
            <rect x="8" y="26" width="14" height="14" rx="3" fill="var(--accent)" opacity=".08"/>
            <rect x="26" y="26" width="14" height="14" rx="3" fill="var(--accent)" opacity=".04"/>
          </svg>
        </div>
        <p class="empty-title">Select a project</p>
        <p class="empty-sub">or create one to get started</p>
      </div>

      <div class="task-pane-inner" id="taskPaneInner" style="display:none">
        <div class="task-pane-header">
          <div class="project-title-row">
            <span class="project-dot-lg" id="projectDotLg"></span>
            <h1 class="project-title" id="projectTitle"></h1>
            <span class="task-count" id="taskCount"></span>
          </div>
          <div class="pane-actions">
            <button class="btn-icon" id="btnToggleDone" title="Show / hide completed">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M5 8l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="btn-icon btn-danger" id="btnDeleteProject" title="Delete project">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M3 4h10M6 4V3h4v1M5 4l.5 9h5L11 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="task-list" id="taskList"></div>

        <div class="add-task-row">
          <button class="btn-add-task" id="btnAddTask">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            Add task
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- New project modal -->
  <div class="modal-backdrop" id="projectModal" style="display:none">
    <div class="modal">
      <h2 class="modal-title">New project</h2>
      <input class="modal-input" id="projectNameInput" type="text" placeholder="Project name" maxlength="40" />
      <div class="color-picker" id="colorPicker"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelProject">Cancel</button>
        <button class="btn-primary" id="btnCreateProject">Create</button>
      </div>
    </div>
  </div>

  <!-- Inline task editor template (cloned dynamically) -->
  <template id="taskEditorTemplate">
    <div class="task-editor">
      <input class="task-editor-input" type="text" placeholder="Task name" maxlength="120" />
      <textarea class="task-editor-notes" placeholder="Notes (optional)" rows="2" maxlength="500"></textarea>
      <div class="task-editor-footer">
        <div class="task-editor-due">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="1.5" y="2.5" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M1.5 5.5h11" stroke="currentColor" stroke-width="1.3"/>
            <path d="M4.5 1v3M9.5 1v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <input class="due-input" type="date" title="Due date" />
        </div>
        <div class="task-editor-btns">
          <button class="btn-secondary btn-sm editor-cancel">Cancel</button>
          <button class="btn-primary btn-sm editor-save">Save</button>
        </div>
      </div>
    </div>
  </template>

  <script src="sidepanel.js"></script>
</body>
</html>
